<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rádio Social Plus - Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      overflow: hidden;
      height: 100vh;
    }

    .player-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%);
    }

    .player-card {
      width: 100%;
      max-width: 320px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .album-cover {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .song-info {
      margin-bottom: 16px;
    }

    .song-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .song-artist {
      font-size: 13px;
      color: #a0aec0;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dc2626;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .volume-slider {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #f97316;
      border-radius: 50%;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #f97316;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }

    .volume-value {
      font-size: 12px;
      color: #a0aec0;
      min-width: 30px;
      text-align: right;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    button {
      background: none;
      border: none;
      color: #a0aec0;
      cursor: pointer;
      font-size: 20px;
      transition: color 0.2s;
      padding: 8px;
    }

    button:hover {
      color: #fff;
    }

    .play-btn {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      transition: transform 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.05);
      color: white;
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .vote-buttons {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .vote-btn {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }

    .vote-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .vote-btn.liked {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }

    .vote-btn.disliked {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .loading {
      text-align: center;
      color: #a0aec0;
      font-size: 14px;
    }

    .error {
      color: #ef4444;
      font-size: 12px;
      text-align: center;
      padding: 8px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="player-card">
      <div class="live-badge">
        <div class="live-dot"></div>
        AO VIVO
      </div>

      <img id="albumCover" class="album-cover" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23333' width='100' height='100'/%3E%3Ctext x='50' y='50' font-size='40' fill='%23666' text-anchor='middle' dominant-baseline='middle'%3E♪%3C/text%3E%3C/svg%3E" alt="Capa do álbum">

      <div class="song-info">
        <div class="song-title" id="songTitle">Carregando...</div>
        <div class="song-artist" id="songArtist">Rádio Social Plus Brasil</div>
      </div>

      <div class="volume-control">
        <span>🔊</span>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="100">
        <span class="volume-value" id="volumeValue">100%</span>
      </div>

      <div class="controls">
        <button class="vote-btn" id="likeBtn" title="Gostei">👍</button>
        <button class="play-btn" id="playBtn" title="Play/Pause">▶</button>
        <button class="vote-btn" id="dislikeBtn" title="Não gostei">👎</button>
      </div>

      <div class="vote-buttons" style="display: none;" id="voteStatus"></div>

      <div id="error" class="error" style="display: none;"></div>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    const API_BASE = window.location.origin;
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const likeBtn = document.getElementById('likeBtn');
    const dislikeBtn = document.getElementById('dislikeBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const songTitle = document.getElementById('songTitle');
    const songArtist = document.getElementById('songArtist');
    const albumCover = document.getElementById('albumCover');
    const errorDiv = document.getElementById('error');

    let isPlaying = false;
    let currentSongId = null;
    let userVoteType = null;

    // Carregar volume salvo
    const savedVolume = localStorage.getItem('playerVolume') || '100';
    volumeSlider.value = savedVolume;
    audioPlayer.volume = savedVolume / 100;
    volumeValue.textContent = savedVolume + '%';

    // Controle de volume
    volumeSlider.addEventListener('input', (e) => {
      const volume = e.target.value;
      audioPlayer.volume = volume / 100;
      volumeValue.textContent = volume + '%';
      localStorage.setItem('playerVolume', volume);
    });

    // Play/Pause
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audioPlayer.pause();
        isPlaying = false;
        playBtn.textContent = '▶';
      } else {
        audioPlayer.play().catch(err => {
          console.error('Erro ao tocar:', err);
          showError('Erro ao conectar ao stream');
        });
        isPlaying = true;
        playBtn.textContent = '⏸';
      }
    });

    // Atualizar metadados
    async function updateMetadata() {
      try {
        const response = await fetch(`${API_BASE}/api/songs/metadata`);
        if (!response.ok) {
          console.warn('Resposta de metadados não OK:', response.status);
          return;
        }
        const data = await response.json();
        console.log('Metadados recebidos:', data);

        if (data && data.title) {
          songTitle.textContent = data.title;
          songArtist.textContent = data.artist || 'Artista desconhecido';
          console.log('Título atualizado:', data.title);

          if (data.albumCover) {
            albumCover.src = data.albumCover;
            console.log('Capa atualizada:', data.albumCover);
          } else {
            console.warn('Sem capa disponível');
            albumCover.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23333%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2240%22%3E♪%3C/text%3E%3C/svg%3E';
          }

          // Se música mudou, resetar votos
          if (currentSongId !== data.id) {
            currentSongId = data.id;
            userVoteType = null;
            likeBtn.classList.remove('liked');
            dislikeBtn.classList.remove('disliked');
          }
        } else {
          console.warn('Dados de metadados incompletos:', data);
        }
      } catch (error) {
        console.error('Erro ao buscar metadados:', error);
      }
    }

    // Votar
    async function vote(voteType) {
      try {
        const response = await fetch(`${API_BASE}/api/trpc/songs.vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            songId: currentSongId,
            voteType: voteType,
          }),
        });

        if (response.ok) {
          userVoteType = voteType;
          likeBtn.classList.toggle('liked', voteType === 'like');
          dislikeBtn.classList.toggle('disliked', voteType === 'dislike');
        }
      } catch (error) {
        console.error('Erro ao votar:', error);
        showError('Erro ao registrar voto');
      }
    }

    likeBtn.addEventListener('click', () => vote('like'));
    dislikeBtn.addEventListener('click', () => vote('dislike'));

    // Mostrar erro
    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 3000);
    }

    // Inicializar
    async function init() {
      // Conectar ao stream
      audioPlayer.src = `${API_BASE}/api/stream`;

      // Atualizar metadados inicialmente
      await updateMetadata();

      // Atualizar metadados a cada 2 segundos
      setInterval(updateMetadata, 2000);

      // Auto-play ao carregar
      audioPlayer.play().catch(() => {
        // Navegador bloqueou autoplay, aguardar clique do usuário
      });
    }

    // Iniciar quando página carregar
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // Manter player vivo mesmo se a página mudar
    window.addEventListener('beforeunload', () => {
      // Não fazer nada, deixar o iframe vivo
    });
  </script>
</body>
</html>
